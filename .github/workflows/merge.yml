name: benchmarks profiler
on:
  repository_dispatch:
    types: [dev-benchmarks]
  workflow_dispatch: {}
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    env:
      GAMMAPY_DATA: /home/runner/work/gammapy-benchmarks/gammapy-benchmarks/gammapy-datasets/dev
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install Gammapy and dependencies
        run: |
          uv venv
          uv pip install git+https://github.com/gammapy/gammapy.git@main#egg=gammapy[validation]
          uv run gammapy info
      - name: download datasets
        # Including LST-1 Crab data from Zenodo
        run: |
          gammapy download datasets
          python utils/download_from_zenodo.py 11445184 $GAMMAPY_DATA/lst1_crab_data
      - name: run benchmarks
        run: |
          cd benchmarks/profilers
          python run_pyinstrument.py
      - name: remove large files produced during benchmarks profiling
        run: |
          rm -f benchmarks/profilers/*.fits
          rm -f benchmarks/profilers/*.html
          rm -f benchmarks/profilers/*.dat
      - name: commit changes
        uses: stefanzweifel/git-auto-commit-action@v7.2.0
        if: success()
        with:
          commit_author: GitHub Actions <actions@github.com>
          commit_message: commit results from benchmarks
      - name: slack notification
        uses: rtCamp/action-slack-notify@v2
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: 'Benchmarks profiling failed'
