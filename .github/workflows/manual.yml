name: validation
on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Title for pull request'
        required: true
        default: 'Update results from validations'
      urlrepo:
        description: 'Git file url to install Gammapy'
        required: true
        default: 'https://github.com/gammapy/gammapy.git'
      branch:
        description: 'Branch name to install Gammapy'
        required: true
        default: 'main'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    env:
      GAMMAPY_DATA: /home/runner/work/gammapy-benchmarks/gammapy-benchmarks/gammapy-datasets/dev
    steps:
      - name: checkout repo
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install Gammapy and dependencies
        run: |
          uv venv
          uv pip install "gammapy[validation] @ git+${{ github.event.inputs.urlrepo }}@${{ github.event.inputs.branch }}"
          uv run gammapy info
      - name: download datasets
        # Including LST-1 Crab data from Zenodo
        run: |
          uv run gammapy download datasets
          uv run python utils/download_from_zenodo.py 11445184 $GAMMAPY_DATA/lst1_crab_data
      - name: run validation
        run: |
          cd validation
          uv run python make.py run-validation all
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          committer: GitHub <noreply@github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          title: ${{ github.event.inputs.title }}
